# webapp-mcp の nginx 配置例（rules/17-deploy.md）
# MCP サーバ専用のホスト名のルートで公開する。MCP クライアントに登録する URL は https://<ホスト名>/mcp
# .env の MCP_PUBLIC_URL は https://<ホスト名>（末尾の / なし）と完全に一致させる。

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Streamable HTTP の応答（Server-Sent Events）を溜めずに流す
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # Authorization ヘッダは既定で渡る。proxy_set_header Authorization "" などで消さないこと
    }
}

server {
    listen 80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}
