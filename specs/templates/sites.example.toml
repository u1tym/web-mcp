# <server-name> の server/sites.toml
# 接続先（サイト）の構成。API キーは書かない（server/.env の SITE_<SITE>_API_KEY に置く）。

default_site = "home"

[sites.home]
title = "自宅"
kind = "claude_webapp"

# 機能名（Web アプリの kebab-case）ごとの API 基点 URL
[sites.home.api]
schedule = "http://localhost:8002"
goods-management = "http://localhost:8006"
knowhow-management = "http://localhost:8005"
expense-management = "http://localhost:8177"
room = "http://localhost:8011"

# サイトを増やすときの例
# [sites.office]
# title = "事務所"
# kind = "claude_webapp"
#
# [sites.office.api]
# schedule = "https://office.example.com/api/schedule"
